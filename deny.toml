# cargo-deny: licenses, advisories (RustSec, the same database cargo-audit
# uses), banned crates and sources. Run with `cargo deny check`.

[graph]
all-features = true
# The platforms sinkd ships for. Other targets pull in crates we never
# build (rustls-platform-verifier's bundled roots on wasm32, for one).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    # subtle (constant-time comparisons, via rustls).
    "BSD-3-Clause",
    # ring, rustls-webpki and untrusted: the TLS stack.
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]

# Dev-dependencies are not license-checked: Brave's adblock crate (MPL-2.0)
# is a test oracle only and is never linked into anything we distribute.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version; they are not published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
