<!doctype html>
<meta charset="utf-8">
<title>Part C (2): bait elements</title>
<!-- Elements with ad-like class names and ids, checked for zero size or
     display:none, the way FuckAdBlock, BlockAdBlock and Google's own
     checks do it. -->
<script>
  window.results = { detections: [], errors: [] };
  function detect(why) { results.detections.push(why); }
  addEventListener("error", (e) => results.errors.push(String((e.error && e.error.stack) || e.message)));
</script>
<body>
<div id="ad-slot" class="adsbox">&nbsp;</div>
<ins class="adsbygoogle" style="display:block;width:300px;height:250px"></ins>
<script>
  const classes = [
    "adsbox",
    "ad-banner",
    "pub_300x250",
    "textAd",
    "text-ad-links",
    "pub_300x250 pub_300x250m pub_728x90 text-ad textAd text_ad text_ads text-ads text-ad-links",
  ];
  const baits = classes.map((name) => {
    const bait = document.createElement("div");
    bait.className = name;
    bait.innerHTML = "&nbsp;";
    bait.style.cssText = "width:1px;height:1px;position:absolute;left:-10000px;top:-1000px";
    document.body.appendChild(bait);
    return bait;
  });
  baits.push(document.getElementById("ad-slot"), document.querySelector("ins.adsbygoogle"));
  const hidden = (el) => {
    const style = getComputedStyle(el);
    return el.offsetParent === null || el.offsetHeight === 0 || el.clientHeight === 0 ||
      style.display === "none" || style.visibility === "hidden";
  };
  addEventListener("load", () => setTimeout(() => {
    for (const bait of baits) {
      if (hidden(bait)) detect(`bait hidden: ${bait.id ? `#${bait.id}` : ""}.${bait.className.replace(/ /g, ".")}`);
    }
    results.done = true;
  }, 500));
</script>
</body>
