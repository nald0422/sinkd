[workspace]
resolver = "3"
members = ["crates/cli", "crates/compiler", "crates/core", "crates/engine-wasm", "crates/filters", "crates/lists", "crates/resolver"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# proptest (dev) needs 1.88; nothing in the shipped code needs newer.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
sinkd-compiler = { path = "crates/compiler" }
sinkd-core = { path = "crates/core", default-features = false }
sinkd-filters = { path = "crates/filters" }
sinkd-lists = { path = "crates/lists" }
sinkd-resolver = { path = "crates/resolver" }

ahash = { version = "0.8.12", default-features = false, features = ["std"] }
anyhow = "1.0.104"
arc-swap = "1.9.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
hashbrown = { version = "0.17.1", default-features = false }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
idna = "1.1.0"
ipnet = { version = "2.12.2", features = ["serde"] }
memchr = "2.8.3"
moka = { version = "0.12.16", default-features = false, features = ["sync"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
regex-syntax = { version = "0.8.11", default-features = false, features = ["std", "unicode"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "ring", "tls12"] }
toml = "1.2.0"
toml_edit = "0.25.18"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }

# dev
adblock = { version = "0.13.5", default-features = false, features = ["full-regex-handling", "single-thread"] }
bytes = "1.12.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
flate2 = "1.1.11"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio"] }
proptest = "1.12.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
debug = "line-tables-only"

# The extension's wasm engine: small over fast, no debug info.
# `cargo build -p sinkd-engine-wasm --target wasm32-unknown-unknown --profile wasm`
[profile.wasm]
inherits = "release"
opt-level = "s"
debug = false
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
debug = "line-tables-only"
