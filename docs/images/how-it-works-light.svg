<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title">
  <title id="title">How sinkd works: filter lists go into sinkd compile, one rule engine in Rust, which feeds the browser extension and the local DNS resolver. The resolver answers blocked names with 0.0.0.0 and sends everything else to encrypted DNS.</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8A8A"/>
    </marker>
  </defs>
  
  <rect x="8" y="115" width="190" height="90" rx="14" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/>
  <text x="103" y="145.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#161616">Filter lists</text>
  <text x="103" y="166.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6B6B">EasyList · EasyPrivacy</text>
  <text x="103" y="184.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6B6B">uBlock Origin</text>
  
  <rect x="252" y="115" width="180" height="90" rx="14" fill="#161616" stroke="#161616" stroke-width="1.5"/>
  <text x="342" y="145.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">sinkd compile</text>
  <text x="342" y="166.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#BDBDBD">one rule engine</text>
  <text x="342" y="184.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#BDBDBD">in Rust</text>
  
  <rect x="506" y="16" width="228" height="96" rx="14" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/>
  <text x="620" y="49.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#161616">Browser extension</text>
  <text x="620" y="70.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6B6B">network rules · page engine</text>
  <text x="620" y="88.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6B6B">scriptlets · privacy</text>
  
  <rect x="506" y="208" width="228" height="96" rx="14" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/>
  <text x="620" y="241.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#161616">Local DNS resolver</text>
  <text x="620" y="262.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6B6B">for every app</text>
  <text x="620" y="280.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6B6B">on the machine</text>
  
  <rect x="790" y="208" width="162" height="96" rx="14" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/>
  <text x="871" y="251" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#161616">Encrypted DNS</text>
  <text x="871" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6B6B">Quad9 · Cloudflare</text>
