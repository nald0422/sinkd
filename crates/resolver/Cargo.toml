[package]
name = "sinkhole-resolver"
description = "The sinkhole DNS daemon: answers blocked names locally and forwards the rest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Criterion owns `cargo bench`; the libtest harness would reject its flags.
[lib]
bench = false

[dependencies]
arc-swap.workspace = true
hickory-proto.workspace = true
ipnet.workspace = true
moka.workspace = true
reqwest = { workspace = true, features = ["http2"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
sinkhole-core = { workspace = true, features = ["config"] }
sinkhole-filters.workspace = true
sinkhole-lists.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
tracing.workspace = true

[dev-dependencies]
bytes.workspace = true
criterion.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
proptest.workspace = true
sinkhole-lists = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true

[[bench]]
name = "engine"
harness = false
