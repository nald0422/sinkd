[package]
name = "sinkd-cli"
description = "The sinkd command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sinkd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
hickory-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
sinkd-compiler.workspace = true
sinkd-core = { workspace = true, features = ["config"] }
sinkd-filters.workspace = true
sinkd-lists.workspace = true
sinkd-resolver.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
