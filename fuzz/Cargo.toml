# Fuzz targets, in cargo-fuzz's layout: `cargo fuzz run <target>` works
# with nightly, and `./run.sh` builds and runs them on stable (see it).
[package]
name = "sinkhole-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Not part of the main workspace: it builds with coverage instrumentation.
[workspace]
members = ["."]

[dependencies]
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
libfuzzer-sys = "0.4"
serde_json = "1.0.154"
sinkhole-compiler = { path = "../crates/compiler" }
sinkhole-core = { path = "../crates/core", features = ["config", "page"] }
sinkhole-filters = { path = "../crates/filters" }
sinkhole-resolver = { path = "../crates/resolver" }

[profile.release]
debug = 1

[[bin]]
name = "filter_line"
path = "fuzz_targets/filter_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter_list"
path = "fuzz_targets/filter_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compile"
path = "fuzz_targets/compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "explain"
path = "fuzz_targets/explain.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_list"
path = "fuzz_targets/dns_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_query"
path = "fuzz_targets/dns_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_answer"
path = "fuzz_targets/dns_answer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "domain"
path = "fuzz_targets/domain.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metrics_request"
path = "fuzz_targets/metrics_request.rs"
test = false
doc = false
bench = false

# Writes the seed corpora (not a fuzz target; built without instrumentation).
[[bin]]
name = "seeds"
path = "seeds.rs"
test = false
doc = false
bench = false
